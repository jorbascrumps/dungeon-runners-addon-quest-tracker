name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install 32-bit MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-i686

      - name: Build
        run: |
          cmake -B build
          cmake --build build

      - name: Package
        id: package
        run: |
          zip="QuestTracker-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -r "../${zip}" QuestTracker)
          echo "zip=${zip}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: QuestTracker
          path: dist/QuestTracker

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" --clobber
